<style>body{font:25px/1.7 sans-serif;background:#132139;color:#eef4ff;padding:45px}strong{color:#8ce5d5}</style>
<h1>纯 IO4 真正断电启动</h1><ol><li>确认没有连接任何跳线。</li><li>拔掉开发板 USB，等待<strong>至少5秒</strong>。</li><li>插回同一个 USB 口，<strong>不连接 GP9，不按 BOOT</strong>。</li><li>完成后回 Codex 回复。</li></ol><p>此次测试保存的 IO4 启动模式，随后会再做 GP9 恢复。</p></html>
