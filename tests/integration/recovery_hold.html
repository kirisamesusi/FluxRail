<style>body{font:24px/1.7 sans-serif;background:#132139;color:#eef4ff;padding:40px}strong{color:#8ce5d5}</style>
<h1>GP9 接触诊断：上电后保持 10 秒</h1>
<p>请保持此窗口在前台。</p><ol><li>拔 USB，断电时连接 GP9（9）与 GND，避开 5V 和 3V3。</li><li>保持跳线接触，插回 USB，不按 BOOT。</li><li><strong>保持至少 10 秒</strong>，程序会自动读 GPIO 状态。</li><li>移除跳线，再回 Codex 回复。</li></ol><p>再次明显发热则立即断电。</p></html>
