<h1>FluxRail：GP9 恢复测试</h1>
<p>此页没有输入框，恢复键产生的 T 键不会输入到聊天或游戏。</p>
<ol><li>拔掉开发板 USB。</li><li>断电时用跳线连接 <strong>GP9（标 9）和 GND</strong>。不要接 5V 或 3V3。</li><li>保持跳线，插回 USB，不按 BOOT。</li><li>等约 3 秒，移除跳线，USB 保持连接。</li></ol>
<p>完成后回到 Codex 回复“已完成”。若再次明显发热，立即断电并告知。</p>
</html>
