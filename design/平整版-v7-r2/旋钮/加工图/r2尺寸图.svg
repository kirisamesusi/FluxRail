<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title">
<title id="title">FluxRail v7 r2 加工与可调阻尼尺寸</title>
<style>
text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#172e37}.head{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:650}.note{font-size:15px;fill:#45616b}.card{fill:#fff;stroke:#cbd9dd}.edge{fill:#e5eff1;stroke:#176674;stroke-width:2}.axis{stroke:#8ba7ad;stroke-dasharray:5 4}.dot{fill:#ae541b}.leader{stroke:#526f78;stroke-width:1.4;fill:none}
</style>
<rect width="1100" height="660" fill="#f0f5f6"/>
<text x="24" y="44" class="head">FLUXRAIL · v7 r2 可调阻尼</text>
<text x="25" y="70" class="note">尺寸单位 mm · 顶视坐标 · 从 r1 改装时只在原封盖补钻攻孔</text>
<rect class="card" x="24" y="91" width="516" height="475" rx="12"/>
<rect class="card" x="556" y="91" width="520" height="475" rx="12"/>
<text x="45" y="123" class="label">01　铝封盖 · 38 × 38 × 2</text>
<rect class="edge" x="123" y="137" width="304" height="304"/>
<path class="axis" d="M111 289H440 M275 130V450"/>
<text x="443" y="294" class="note">+X</text><text x="285" y="151" class="note">+Y</text>
<circle cx="275" cy="289" r="70.4" fill="white" stroke="#176674" stroke-width="2"/>
<circle cx="275" cy="289" r="90" fill="none" stroke="#53728d" stroke-dasharray="5 4"/>
<g fill="#fff" stroke="#176674" stroke-width="1.4">
<circle cx="150.2" cy="164.2" r="9.6"/><circle cx="399.8" cy="164.2" r="9.6"/><circle cx="150.2" cy="413.8" r="9.6"/><circle cx="399.8" cy="413.8" r="9.6"/>
<circle cx="183" cy="197" r="9.6"/><circle cx="367" cy="197" r="9.6"/><circle cx="183" cy="381" r="9.6"/><circle cx="367" cy="381" r="9.6"/>
<circle cx="172.6" cy="236.2" r="9.6"/><circle cx="377.4" cy="236.2" r="9.6"/><circle cx="172.6" cy="341.8" r="9.6"/><circle cx="377.4" cy="341.8" r="9.6"/>
</g>
<circle class="dot" cx="323" cy="408.2" r="6.4"/>
<path class="leader" d="M323 413v47h65"/>
<text x="45" y="480" class="label">新增外调螺丝孔 (+6.00, −14.90)</text>
<text x="45" y="505" class="note">Ø1.60 底孔，M2×0.4 切削丝锥通牙，孔口去毛刺。</text>
<text x="45" y="530" class="note">原中心 Ø17.60 通孔，底面 Ø22.50 平底口深 1.30。</text>
<text x="577" y="123" class="label">02　摩擦副 · 两片 POM 夹一片黄铜盘</text>
<g transform="translate(690 254)">
<circle r="88" fill="#ebd7a3" stroke="#7b6638" stroke-width="2"/>
<circle r="55.9" fill="#fff" stroke="#7b6638" stroke-width="2"/>
<path d="M55 -8.9h8.2v17.8h-8.2 M-55 -8.9h-8.2v17.8h8.2" fill="#fff" stroke="#7b6638" stroke-width="2"/>
<path class="axis" d="M-102 0H102 M0 -100V100"/>
</g>
<g transform="translate(947 254)">
<circle r="86" fill="#f9f7e5" stroke="#6f785e" stroke-width="2"/>
<circle r="64.5" fill="#fff" stroke="#6f785e" stroke-width="2"/>
<path d="M87 -7.75H77.8v15.5H87 M-87 -7.75h9.2v15.5H-87" fill="#fff" stroke="#6f785e" stroke-width="2"/>
<path class="axis" d="M-100 0H100 M0 -100V100"/>
</g>
<text x="577" y="365" class="label">黄铜盘</text><text x="831" y="365" class="label">白色 POM ×2</text>
<text x="577" y="390" class="note">外 Ø20.40 · 内 Ø12.96 · 厚1.00</text><text x="831" y="390" class="note">外 Ø20 · 内 Ø15 · 厚1.00</text>
<text x="577" y="416" class="note">两驱动槽宽2.06，槽端 X=±7.305。</text><text x="831" y="416" class="note">两防转槽宽1.80，槽底 X=±9.05。</text>
<path d="M579 444H1050" stroke="#d7e2e4"/>
<text x="577" y="473" class="note">黄铜盘按 DXF 切轮廓，双面平整去毛刺。</text>
<text x="577" y="499" class="note">POM 槽可用细锉配合防转键，保持接触面平整。</text>
<text x="577" y="525" class="note">示意图只作尺寸核对，切割用 DXF，零件试配用 STEP。</text>
<rect x="24" y="584" width="1052" height="52" rx="9" fill="#dcebee"/>
<text x="46" y="616" class="label">从上向下　调节螺丝 → 导向压环 → 波簧 → 上托环 / POM → 黄铜盘 → 下 POM → 底壳</text>
</svg>
