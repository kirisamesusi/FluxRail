<title>FluxRail 配置页原型</title>
<style>
/* 布局：顶栏 / 横幅（标题 + 看板娘说话）/ 三栏（模板·历史 | 设备面板·灯光 | 检查器）/ 状态栏。桌面优先，最小宽度 1100px，不做移动端适配。 */
:root{
  --blue:#8FD3F0; --blue-soft:#BFE6F7; --blue-wash:#EAF7FD; --blue-line:#CBE9F6;
  --pink:#F7A8C4; --pink-soft:#FBC5D8; --pink-wash:#FFE9F1; --pink-deep:#C2456F;
  --ink:#1F3A4A; --muted:#52707F; --faint:#7A93A1; --link:#2A7FA8;
  --panel:linear-gradient(155deg,#FFFFFF 0%,#F2F9FD 42%,#FFF3F8 100%); --warn-ink:#9B2F57; --err:#B23A48; --err-wash:#FBE3E3; --ok:#2F9E6B;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:#F4F8FB;font-size:14px}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{min-width:1100px;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#EAF7FD 0%,#FFF1F6 100%)}
h1,h2,h3{margin:0}

/* 顶栏 */
.top{display:flex;align-items:center;gap:18px;padding:10px 28px;background:rgba(255,255,255,.9);border-bottom:2px dotted #BFE3F3}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#DDF1FA}
.brand b{font-size:21px;font-weight:800;letter-spacing:.04em}
.io4{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 12px;border-radius:16px;background:#fff;border:2px solid var(--blue-line);text-align:left}
.io4:disabled{opacity:.6}
.sw{position:relative;width:40px;height:22px;border-radius:999px;background:var(--blue-line);flex:none;transition:background .15s}
.sw i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.io4[aria-checked="true"] .sw{background:var(--pink)}
.io4[aria-checked="true"] .sw i{left:21px}
.io4 span.t{display:flex;flex-direction:column;line-height:1.3}
.io4 span.t b{font-size:14px}
.io4 span.t small{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex:1;justify-content:center}
.tab{border:0;padding:8px 22px;border-radius:999px;background:#fff;font-size:14px}
.tab[aria-selected="true"]{background:var(--blue);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:#F2F5F7;font-size:13px;color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#9FB3BF}
.pill.on{background:#E3F5EC;color:#256B4B}
.pill.on i{background:var(--ok)}
.btn{height:38px;padding:0 20px;border-radius:999px;border:2px solid transparent;font-size:14px;font-weight:700;white-space:nowrap}
.btn.line{border-color:#D5E0E7;background:#fff;color:#3D5666;font-weight:600}
.btn.line:disabled{opacity:.5}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.blue:disabled{opacity:.7}
.btn.pink{background:var(--pink);border-color:var(--pink)}
.btn.pink:disabled{background:#F9DCE7;border-color:#F9DCE7;color:#8E6577}
.btn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink-deep);margin-right:8px}

/* 横幅 */
.banner-wrap{padding:20px 24px 0}
.banner{min-height:290px;border-radius:28px;background:linear-gradient(90deg,#FFF 0%,#F3FAFE 55%,#FFF1F6 100%);box-shadow:0 6px 24px rgba(79,179,224,.12);display:flex;align-items:center;justify-content:space-between;gap:32px;padding:20px 40px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--pink-deep);font-weight:700}
.banner h1{font-size:44px;line-height:1.1;margin:10px 0}
.banner p{margin:0;font-size:15px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px;align-items:center}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 13px;box-sizing:border-box;line-height:1;border-radius:999px;background:var(--blue-wash);font-size:13px;font-family:var(--mono)}
.chip.p{background:var(--pink-wash);font-family:var(--font);font-weight:700}
.chip.off{opacity:.55}
.talk{flex:none;display:flex;align-items:center;gap:14px;margin-right:140px}
.bubble{position:relative;width:290px;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:12px 16px;line-height:1.55;transition:border-color .2s}
.bubble::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-7px;width:14px;height:14px;background:#fff;border-top:2px solid var(--bc,var(--ink));border-right:2px solid var(--bc,var(--ink));transform:rotate(45deg)}
.bubble .bt{display:flex;align-items:center;gap:8px;font-weight:700}
.bubble .bb{color:var(--muted);margin-top:2px}
.bubble .ba{margin-top:8px;display:flex;gap:8px}
.bubble .ba button{height:30px;padding:0 14px;border-radius:999px;border:2px solid var(--blue-line);background:#fff;font-size:13px}
.talk img{height:230px;width:auto;flex:none}

/* 主体 */
main.grid{flex:1;display:flex;gap:20px;padding:20px 24px;align-items:stretch}
.card{background:var(--panel);border-radius:24px;padding:18px;box-shadow:0 4px 18px rgba(79,179,224,.12)}
.left{width:248px;flex:none;position:relative}
.leftin{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px}
.leftin .log{flex:1 1 120px;min-height:120px;overflow:auto}
.leftin>.card:not(.log):not(.devinfo){flex:none}
.leftin>.devinfo{flex:0 1 auto;min-height:58px;overflow:auto}
.left h2{font-size:17px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.head small{font-size:12px;color:var(--faint)}
.tpl{display:flex;width:100%;align-items:center;justify-content:space-between;padding:11px 14px;margin-bottom:8px;border-radius:16px;background:#F7FBFD;border:2px solid transparent;text-align:left;font-size:14px}
.tpl:hover{background:#EEF8FD}
.tpl.act{background:#DDF1FA;border-color:var(--blue);font-weight:700}
.tpl.sel{border-color:var(--pink);box-shadow:0 0 0 3px rgba(247,168,196,.45)}
.tpl em{font-style:normal;font-size:12px;color:#8E4A66;font-weight:700}
.add{width:100%;height:38px;border-radius:999px;border:2px dashed var(--blue-line);background:transparent;font-size:14px;color:var(--link)}
.add:disabled{opacity:.5}
.log{flex:1;display:flex;flex-direction:column;gap:10px}
.logrow{display:flex;gap:10px;font-size:13px;line-height:1.5}
.logrow time{color:var(--faint);font-family:var(--mono);flex:none}
.logrow.new{animation:fadein .5s}
@keyframes fadein{from{background:var(--pink-wash)}to{background:transparent}}

.center{flex:1;min-width:0;background:var(--panel);border-radius:28px;padding:24px 28px;box-shadow:0 6px 24px rgba(79,179,224,.12);display:flex;flex-direction:column;gap:20px}
.center>.head h2{font-size:22px}
.legend{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ldot{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--blue-line)}
.lbar{width:18px;height:6px;border-radius:3px;background:var(--pink)}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:46px;padding:10px 0}
.ctrls{display:flex;align-items:center;gap:36px;padding:0 6px}
.knob{position:relative;width:160px;height:160px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 36%,#FFFFFF 0%,#F4F9FD 72%);padding:0;flex:none;touch-action:none;box-shadow:0 8px 20px rgba(79,179,224,.18)}
.knob svg{display:block;width:100%;height:100%;overflow:visible}
.knob.sel{box-shadow:0 0 0 6px rgba(247,168,196,.5),0 8px 20px rgba(79,179,224,.18)}
.knob .mn,.knob .ma{transform-origin:80px 80px;transition:opacity .2s}
.knob.off .mn,.knob.off .ma{opacity:0}
.sliderbox{flex:1;min-width:0;padding:8px 0 12px;border-radius:26px;border:2px solid transparent;background:transparent;display:block;text-align:left}
.sliderbox.sel{border-color:var(--pink);box-shadow:0 0 0 5px rgba(247,168,196,.4)}
.strack{position:relative;height:24px;margin:34px 34px 0}
.strack .rail{position:absolute;inset:0;border-radius:999px;background:linear-gradient(180deg,#EAF5FB,#F7FBFE);box-shadow:inset 0 0 0 3.5px #BFE0F1,inset 0 3px 6px rgba(31,58,74,.08)}
.strack .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:999px;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.85) 2.2px,transparent 2.8px) 0 0/22px 100%,linear-gradient(180deg,#FBC5D8,#F29DBB);box-shadow:inset 0 -3px 0 rgba(194,69,111,.18)}
.strack .fill::after{content:"";position:absolute;left:12px;right:12px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.7)}
.strack .thumb{position:absolute;top:-7px;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#BFE9FA,#8FD3F0 70%);border:5px solid #fff;box-shadow:0 3px 10px rgba(79,179,224,.5)}
.strack .pin{position:absolute;top:-24px;margin-left:-9px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:13px solid var(--pink);filter:drop-shadow(0 2px 0 rgba(194,69,111,.25))}
.sliderbox.off .fill,.sliderbox.off .thumb,.sliderbox.off .pin{opacity:0}
.ticks{display:flex;justify-content:space-between;align-items:flex-start;margin:12px 34px 0}
.ticks i{width:3px;height:8px;border-radius:2px;background:#C5DCE8}
.ticks i.M{height:14px;background:#9CC4D8}
.keys{display:flex;justify-content:center;gap:56px}
.keys>div{display:flex;gap:16px}
.key{width:90px;height:82px;border-radius:22px;background:var(--blue-soft);border:2px solid var(--blue);box-shadow:0 4px 0 var(--blue),inset 0 4px 0 rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;transition:transform .08s}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue)}
.key b{font-size:15px;font-weight:800}
.key span{font-size:13px;color:#3D6377;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key.down{transform:translateY(3px);background:#fff;border-color:var(--blue);box-shadow:0 1px 0 var(--blue),0 0 0 6px rgba(143,211,240,.5),inset 0 0 14px rgba(143,211,240,.6)}
.key.wide.down{background:#fff;border-color:#F29DBB;box-shadow:0 1px 0 #F29DBB,0 0 0 6px rgba(247,168,196,.5),inset 0 0 14px rgba(247,168,196,.6)}
.key.sel{background:var(--blue);border-color:var(--ink);box-shadow:0 0 0 4px rgba(247,168,196,.7)}
.key.dis{background:#EEF3F6;border-color:#C9D6DD;box-shadow:0 4px 0 #C9D6DD;color:#8AA0AC}
.key.dis span{color:#8AA0AC}
.key.wide{width:108px;background:var(--pink-soft);border-color:#F29DBB;box-shadow:0 4px 0 #F29DBB,inset 0 4px 0 rgba(255,255,255,.7)}
.key.wide span{color:#7B3A55}
.key.wide.sel{background:var(--pink);border-color:var(--ink);box-shadow:0 0 0 4px rgba(143,211,240,.8)}
.bottomkeys{display:flex;justify-content:center;gap:240px}
.light{border-top:2px dotted #F9D0DF;padding-top:18px;display:flex;flex-direction:column;gap:14px;margin-top:auto}
.light h3{font-size:17px}
.lrow{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.lrow>div{display:flex;align-items:center;gap:10px}
.lrow label,.lrow .lb{font-size:14px;font-weight:700}
select.sel-in{height:40px;min-width:150px;border-radius:14px;border:2px solid var(--blue-line);padding:0 12px;font-size:14px;background:#fff}
select.sel-in.big{height:40px;font-size:15px;padding:0 14px;width:100%}
select:disabled,input:disabled{opacity:.55;cursor:not-allowed}
.val{min-width:44px;text-align:center;padding:5px 0;border-radius:12px;background:#F3FAFE;font-size:13px;font-family:var(--mono)}
input[type=range]{accent-color:#E2779F;flex:1}
.sw-row{display:flex;gap:10px}
.cs{width:30px;height:30px;border-radius:50%;border:0;padding:0}
.cs[aria-pressed="true"],.cs.sel{box-shadow:0 0 0 3px var(--ink)}
.cs.custom{position:relative;overflow:hidden;display:inline-block;background:conic-gradient(#ff9aa2,#ffdf8e,#b5ead7,#8FD3F0,#d5c6f2,#ff9aa2);box-shadow:0 0 0 2px #fff,0 0 0 3px #CBD9E1}
.cs.custom input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer;padding:0;border:0}
.cs.custom.dis{opacity:.5}
.cs.white{box-shadow:inset 0 0 0 2px #CBD9E1}
.cs.white[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #CBD9E1,0 0 0 3px var(--ink)}
.hexv{font-family:var(--mono);font-size:12px;color:var(--muted);padding:5px 9px;border-radius:10px;background:#F3FAFE}
.kdot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(31,58,74,.25)}
.key{position:relative}
.cs.custom.dis input{cursor:not-allowed}
.listen{border-color:var(--pink)!important;background:var(--pink-wash)!important;color:var(--warn-ink)}
.numin{width:60px;height:34px;border-radius:12px;border:2px solid var(--blue-line);text-align:center;font-size:14px;font-family:var(--mono);background:#fff}
.cs:disabled{opacity:.5}

.right{width:320px;flex:none;background:var(--panel);border-radius:28px;padding:22px 24px 24px;box-shadow:0 6px 24px rgba(247,168,196,.18);display:flex;flex-direction:column;gap:12px}
.right h2{font-size:26px;margin-top:4px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lb{font-size:14px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.row input[type=checkbox]{width:20px;height:20px;accent-color:#E2779F}
.note{font-size:13px;line-height:1.7;color:var(--muted)}
.readout{padding:10px 14px;border-radius:14px;background:#F3FAFE;display:flex;flex-direction:column;gap:8px}
.readout .two{display:flex;gap:16px}
.readout .two>div{flex:1;min-width:0}
.readout .nm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.readout .num{margin-top:3px;font-size:17px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.readout .num.none{font-size:14px;font-family:var(--font);font-weight:600;color:var(--faint)}
.hero{margin-top:auto;margin-bottom:34px;display:flex;position:relative}
.hero img{width:100%;height:auto;display:block}
.herobtn{border:0;background:transparent;padding:0;width:100%;border-radius:20px;position:relative;top:18px}
.herobtn:active img{transform:scale(.985)}
.hero img{transition:transform .12s}
.mbub{position:absolute;right:6px;bottom:calc(100% + 2px);width:200px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:13.5px;line-height:1.6;z-index:5;box-shadow:0 6px 18px rgba(31,58,74,.15);animation:pop .22s ease-out}
.mbub::after{content:"";position:absolute;right:46px;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
@keyframes pop{from{transform:translateY(6px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.rbtn{height:42px;border-radius:999px;border:2px solid var(--blue-line);background:#fff;font-size:14px;font-weight:600}
.rbtn.main{background:var(--blue);border-color:var(--blue);font-weight:700}
.rbtn.danger{border-color:#E3B5BC;color:#8F2433}
.rbtn:disabled{opacity:.5}
.nameedit{display:flex;gap:8px}
.nameedit input{flex:1;min-width:0;height:40px;border-radius:12px;border:2px solid var(--blue-line);padding:0 12px;font-size:14px}
.nameedit button{height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--blue);font-weight:700}

/* 状态栏 */
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:9px 24px;background:rgba(255,255,255,.88);border-top:2px dotted #BFE3F3;font-size:13px;color:var(--muted)}
.foot .sim{display:flex;align-items:center;gap:8px}
.foot select{height:30px;border-radius:10px;border:2px solid var(--blue-line);padding:0 8px;font-size:13px;background:#fff}
.dirtytag{color:var(--warn-ink);font-weight:700}

.placeholder{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.placeholder div{max-width:460px;background:#fff;border-radius:28px;padding:36px;text-align:center;box-shadow:0 6px 24px rgba(79,179,224,.12);line-height:1.8;color:var(--muted)}
.placeholder h2{color:var(--ink);font-size:24px;margin-bottom:8px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(31,58,74,.32);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{width:400px;background:#fff;border:2px solid var(--blue-line);border-radius:24px;padding:24px;box-shadow:0 12px 36px rgba(31,58,74,.28);display:flex;flex-direction:column;gap:14px}
.dlg .hd{display:flex;align-items:center;gap:12px}
.dlg h2{font-size:19px}
.dlg .ic{width:36px;height:36px;border-radius:50%;background:var(--pink-wash);display:flex;align-items:center;justify-content:center;flex:none}
.dlg.danger .ic{background:var(--err-wash)}
.dlg p{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
.dlg .dnote{font-size:13px;color:var(--faint)}
.dlg .derr{color:var(--err);font-size:13px;min-height:0}
.dlg .warnbox{padding:10px 12px;border-radius:14px;background:var(--pink-wash);border:2px solid #F3C3D6}
.dlg .warnbox strong{color:var(--warn-ink);font-size:14px}
.dlg .dname{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.dlg .dname input{height:42px;border-radius:12px;border:2px solid var(--blue-line);padding:0 12px;font-size:14px;font-weight:400}
.devdl{display:block;margin:8px 0 0;font-size:12.5px;line-height:1.4}
.devdl dt{color:var(--faint);font-size:11.5px;margin-top:7px}.devdl dt:first-child{margin-top:0}.devdl dd{margin:1px 0 0;overflow-wrap:anywhere}
details.devinfo summary{cursor:pointer;font-size:17px;font-weight:700}
.dlg .ft{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.dlg .ft button{height:40px;padding:0 18px;border-radius:999px;border:2px solid var(--blue-line);background:#fff;font-size:14px}
.dlg .ft button.ok{border-color:var(--blue-line)}
.dlg.danger .ft button.ok{border-color:#E3B5BC;color:#8F2433}
.dlg .ft button.cancel{border:0;background:var(--blue);font-weight:700;padding:0 22px}
.dlg .ft button.cancel:focus-visible{outline:3px solid var(--ink);outline-offset:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 桌面自适应：1920 / 1440 / 1280 都排得下。不适配手机，最小宽度 1200px */
.app{min-width:1200px}
.banner-wrap,main.grid{width:100%;max-width:1800px;margin-left:auto;margin-right:auto}
.io4{flex:none}
@media (max-width:1560px){
  .key{width:78px;height:72px;border-radius:19px}.key.wide{width:94px}
  .keys{gap:40px}.keys>div{gap:12px}.bottomkeys{gap:170px}
  .knob{width:136px;height:136px}.ctrls{gap:26px}
  .left{width:226px}.right{width:300px}
  .banner{padding:20px 32px}.banner h1{font-size:40px}.talk{margin-right:60px}
  .stage{gap:38px}
}
@media (max-width:1360px){
  .top{gap:10px;padding:10px 16px}
  .tab{padding:8px 14px}.btn{padding:0 14px}.io4{padding:6px 12px 6px 10px}
  main.grid{gap:14px;padding:16px}.banner-wrap{padding:16px 16px 0}
  .left{width:204px}.right{width:278px;padding:20px}
  .center{padding:20px 20px}
  .key{width:64px;height:62px;border-radius:17px}.key b{font-size:14px}.key span{font-size:12px;max-width:56px}.key.wide{width:80px}
  .keys{gap:28px}.keys>div{gap:8px}.bottomkeys{gap:120px}
  .knob{width:116px;height:116px}.ctrls{gap:18px}
  .banner{padding:16px 24px;min-height:250px}.banner h1{font-size:36px}.talk{margin-right:10px;gap:10px}.talk img{height:200px}.bubble{width:250px}
  .stage{gap:30px}
  .lrow{gap:16px}
}
@media (max-height:800px){

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var HEXDEF='#8FD3F0';
  var KEYS=[['BT8','A'],['BT7','S'],['BT6','D'],['BT5','F'],['BT4','J'],['BT3','K'],['BT2','L'],['BT1',';'],['BT9','V'],['BT10','N']];
  var KDEF={};KEYS.forEach(function(k){KDEF[k[0]]=k[1]});
  function defCfg(){
    var c={keys:{},light:{enabled:true,mode:'常亮',bright:60,color:'#8FD3F0'},lk:{en:true,rev:false,axis:'X',sens:5},rk:{en:true,rev:false,axis:'Y',sens:5},sl:{en:true,rev:false,sens:5}};
    KEYS.forEach(function(k){c.keys[k[0]]={action:'键盘 · '+k[1],bright:60,color:'#8FD3F0'}});
    return c;
  }
  var clone=function(o){return JSON.parse(JSON.stringify(o))};
  var S={
    tab:'status',connected:false,connecting:false,io4:false,
    tpls:[{id:'sdvx',name:'SDVX 双旋钮',ascii:'SDVX',preset:true},{id:'ongeki',name:'音击',ascii:'Ongeki',preset:true},{id:'falsus',name:'In Falsus',ascii:'In Falsus',preset:true},{id:'multik',name:'普通多 K',ascii:'Multi-K',preset:true}],
    active:'sdvx',savedActive:'sdvx',io4Saved:false,sel:{type:'key',id:'BT3'},
    cfg:defCfg(),saved:defCfg(),log:[],flash:null,nextTpl:1,renaming:false,saving:false,
    sig:{lk:0,rk:0,sl:.5},shown:{lk:0,rk:0,sl:.5},listen:false,logSnap:null,pal:{g:['#8FD3F0','#F7A8C4','#FFFFFF'],k:['#8FD3F0','#F7A8C4','#FFFFFF']},nx:{g:0,k:0},t0:performance.now()
  };
  var flashTimer=null;

  function hhmm(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  function addLog(t){S.log.unshift({time:hhmm(),text:t,fresh:true});S.log=S.log.slice(0,8);renderLog()}
  function flat(o,p,out){out=out||{};for(var k in o){if(o[k]&&typeof o[k]==='object')flat(o[k],p+k+'.',out);else out[p+k]=o[k]}return out}
  function dirtyCount(){
    var a=flat(S.cfg,''),b=flat(S.saved,''),n=0;
    for(var k in a)if(a[k]!==b[k])n++;
    if(S.active!==S.savedActive)n++;
    if(S.io4!==S.io4Saved)n++;
    return n;
  }
  function tplName(id){var t=S.tpls.filter(function(x){return x.id===id})[0];return t?t.name:''}

  /* ---------- 气泡 ---------- */
  var ICON={
    ok:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A7FA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A7FA8" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><path d="M12 6.5v.01"/></svg>',
    warn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="#C2456F" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>',
    err:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23A48" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v9"/><path d="M12 18.5v.01"/></svg>'
  };
  function baseBubble(){
    if(S.connecting)return{k:'info',t:'正在连接…',b:'请在浏览器弹窗里选择 FluxRail。'};
    if(!S.connected)return{k:'info',t:'尚未连接设备',b:'连接后可读取和修改设置。'};
    var n=dirtyCount();
    if(n)return{k:'warn',t:'有 '+n+' 处修改已生效，还没保存',b:'断电或切换模板会丢失。点右上角「应用并保存」写入设备，或「还原」。',discard:true};
    return{k:'ok',t:'设置和设备一致',b:'修改后点「应用并保存」写入设备'};
  }
  function say(msg,ms){
    S.flash=msg;clearTimeout(flashTimer);renderBubble();
    if(ms)flashTimer=setTimeout(function(){S.flash=null;renderBubble()},ms);
  }
  function renderBubble(){
    var m=S.flash||baseBubble();
    var bc={ok:'#1F3A4A',info:'#1F3A4A',warn:'#C2456F',err:'#B23A48'}[m.k];
    var b=$('#bubble');b.style.borderColor=bc;b.style.setProperty('--bc',bc);
    var tc={ok:'var(--ink)',info:'var(--ink)',warn:'var(--warn-ink)',err:'#8F2433'}[m.k];
    b.innerHTML='<div class="bt" style="color:'+tc+'">'+ICON[m.k]+'<span>'+m.t+'</span></div><div class="bb">'+m.b+'</div>'+(m.discard?'<div class="ba"><button type="button" id="discard">还原修改</button></div>':'');
    var d=$('#discard');if(d)d.onclick=discard;
  }

  /* ---------- 弹窗 ---------- */
  var NAME_RULE='模板名称为 1～10 个字符，可以用中文，不含双引号和反斜杠。';
  function validName(v){var n=Array.from(v).length;return n>=1&&n<=10&&!/["\\\x00-\x1F]/.test(v)&&v.trim()===v&&new TextEncoder().encode(v).length<=31}
  function confirmDlg(o){
    var prev=document.activeElement,root=$('#dlgRoot'),warnCls=o.danger?'#B23A48':'#C2456F';
    root.innerHTML='<div class="mask"><form class="dlg '+(o.danger?'danger':'')+'" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd" novalidate>'+
      '<div class="hd"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+warnCls+'" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 6v8"/><path d="M12 18.5v.01"/></svg></span><h2 id="dt"></h2></div>'+
      '<div id="dd"><div class="warnbox" id="dwarn" hidden><strong></strong><p></p></div><p id="dbody"></p><p class="dnote" id="dnote" hidden></p></div>'+
      '<label class="dname" id="dnamerow" hidden>新模板名称<input id="dname" autocomplete="off" spellcheck="false" maxlength="10" aria-describedby="dnamehelp derr"></label>'+
      '<p class="dnote" id="dnamehelp" hidden>'+NAME_RULE+'</p><p class="derr" id="derr" role="alert"></p>'+
      '<div class="ft"><button type="submit" class="ok"></button><button type="button" class="cancel">取消</button></div></form></div>';
    $('#dt').textContent=o.title;$('.ok',root).textContent=o.ok;
    if(o.warning){$('#dwarn').hidden=false;$('#dwarn strong').textContent=o.warning;$('#dwarn p').textContent=o.body}else $('#dbody').textContent=o.body;
    if(o.note){$('#dnote').hidden=false;$('#dnote').textContent=o.note}
    if(o.name!==undefined){$('#dnamerow').hidden=false;$('#dnamehelp').hidden=false;$('#dname').value=o.name}
    function close(){root.innerHTML='';document.removeEventListener('keydown',key);if(prev&&prev.focus)prev.focus()}
    function key(e){
      if(e.key==='Escape'){e.preventDefault();close()}
      if(e.key==='Tab'){
        var f=[].slice.call(root.querySelectorAll('input:not([hidden]),button')).filter(function(x){return !x.closest('[hidden]')}),i=f.indexOf(document.activeElement);
        e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
      }
    }
    document.addEventListener('keydown',key);
    $('.dlg',root).onsubmit=function(e){
      e.preventDefault();
      if(o.name!==undefined){var v=$('#dname').value;if(!validName(v)){$('#derr').textContent=NAME_RULE;$('#dname').focus();return}close();o.onOk(v);return}
      close();o.onOk();
    };
    $('.cancel',root).onclick=close;
    if(o.name!==undefined){$('#dname').focus();$('#dname').select()}else $('.cancel',root).focus();
  }

  /* ---------- 渲染：顶栏 ---------- */
  function renderTop(){
    var n=dirtyCount();
    $('#pill').className='pill'+(S.connected?' on':'');
    $('#pilltxt').textContent=S.connected?'已连接':(S.connecting?'连接中':'未连接');
    var cb=$('#conn');
    cb.textContent=S.connecting?'连接中…':(S.connected?'断开':'连接 FluxRail');
    cb.disabled=S.connecting;
    $('#reboot').disabled=!S.connected;
    var ap=$('#apply');
    ap.disabled=!S.connected||n===0||S.saving;
    ap.innerHTML=S.saving?'保存中…':((S.connected&&n?'<span class="dot"></span>':'')+'应用并保存');
    var io=$('#io4');io.disabled=!S.connected;io.setAttribute('aria-checked',S.io4);
    $('#io4sub').textContent=S.connected?((S.io4!==S.io4Saved?'待应用：':'已读回：')+(S.io4?'IO4 模式':'普通模式')):'连接后读取启动模式';
    $('#io4').title='应用并保存后，下次上电启用。';
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++)tabs[i].setAttribute('aria-selected',tabs[i].dataset.tab===S.tab);
  }
  function renderDevInfo(){
    var c=S.connected,v=function(x){return c?x:'连接后查看'};
    var rows=[['设备型号',v('FluxRail / RP2040')],['固件 / 协议',v('0.10.2 / CDC v1')],['唯一序号',v('E6614103E7… （示例）')],['当前 USB 模式',v(S.io4Saved?'IO4':'普通模式')],['启动模式（设备 RAM）',v(S.io4Saved?'IO4 模式':'普通模式')],['活动模板',v(tplName(S.savedActive))],['设置修订号',v('12')]];
    $('#devdl').innerHTML=rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'}).join('');
  }
  function renderChips(){
    renderDevInfo();
    var c=S.connected;
    $('#chips').innerHTML=
      '<span class="chip'+(c?'':' off')+'">'+(c?'FluxRail RP2040 4MiB':'设备型号：连接后读取')+'</span>'+
      '<span class="chip'+(c?'':' off')+'">'+(c?'固件 0.10.2':'固件：—')+'</span>'+
      '<span class="chip p'+(c?'':' off')+'">'+(c?'活动模板 · '+tplName(S.active)+(S.active!==S.savedActive?'（未保存）':''):'活动模板：—')+'</span>';
  }
  function renderLog(){
    $('#log').innerHTML=S.log.length?S.log.map(function(l){
      var c='logrow'+(l.fresh?' new':'');l.fresh=false;
      return '<div class="'+c+'"><time>'+l.time+'</time><span>'+l.text+'</span></div>';
    }).join(''):'<div style="font-size:13px;color:var(--faint)">还没有操作记录</div>';
  }
  function renderTpls(){
    $('#tpls').innerHTML=S.tpls.map(function(t){
      var cls='tpl'+(t.id===S.active?' act':'')+((S.sel.type==='tpl'&&S.sel.id===t.id)?' sel':'');
      return '<button type="button" class="'+cls+'" data-id="'+t.id+'"><span>'+t.name+'</span><em>'+(t.id===S.active?'使用中':'')+'</em></button>';
    }).join('');
    var bs=document.querySelectorAll('.tpl');
    for(var i=0;i<bs.length;i++)bs[i].onclick=(function(b){return function(){select({type:'tpl',id:b.dataset.id})}})(bs[i]);
    $('#newTpl').disabled=!S.connected;
  }

  /* ---------- 渲染：面板 ---------- */

  function loop(now){
    var m=$('#sim').value,t=(now-S.t0)/1000;

      S.sig.lk=1.2*Math.sin(t*.7);
      S.sig.rk=.9*Math.sin(t*.45+1.6)+(t*.05)%1;
      S.sig.sl=.5+.38*Math.sin(t*.55+.8);
      S.shown.lk=S.sig.lk;S.shown.rk=S.sig.rk;S.shown.sl=S.sig.sl;
    }else{
      ['lk','rk','sl'].forEach(function(k){var d=S.sig[k]-S.shown[k];S.shown[k]=Math.abs(d)<.0005?S.sig[k]:S.shown[k]+d*.14});

  function describe(k,o,n,all,old){
    var p=k.split('.');
    if(p[0]==='keys'){
      var id=p[1];
      if(p[2]==='action')return id+' 按键动作：'+o+' → '+n;
      if(p[2]==='bright')return id+' 按键亮度：'+o+' → '+n;
      if(p[2]==='color')return id+' 按键颜色：'+o+' → '+n;
    }
    if(p[0]==='light'){
      if(p[1]==='enabled')return n?'键灯已启用':'键灯已关闭';
      if(p[1]==='mode')return '灯效模式：'+o+' → '+n;
      if(p[1]==='bright')return '灯光亮度：'+o+' → '+n;
      if(p[1]==='color')return '全局颜色：'+o+' → '+n;
    }
    var nm=AX[p[0]];
    if(nm){
      if(p[1]==='sens')return nm+(p[0]==='sl'?'中心灵敏度：':'灵敏度：')+Number(o).toFixed(1)+' → '+Number(n).toFixed(1);
      if(p[1]==='en')return nm+(n?' 已启用':' 已停用');
      if(p[1]==='rev')return nm+(n?' 已反转输出方向':' 已取消反转');
      if(p[1]==='axis')return nm+' 输出轴：'+o+' → '+n;
    }
    return null;
  }

  }
  function apply(){
    S.saving=true;renderTop();say({k:'info',t:'正在应用并保存',b:'请等待设备确认。'},0);
    setTimeout(function(){
      S.saving=false;S.saved=clone(S.cfg);S.savedActive=S.active;S.io4Saved=S.io4;
      addLog('设置已应用并保存，模板：'+tplName(S.active));
      renderAll();say({k:'ok',t:'设置已应用并保存',b:'当前模板和设备保存状态已读回。'+(S.io4?'下次上电进入 IO4 模式。':'')},5000);
    },900);
  }

  /* ---------- 事件 ---------- */
  $('#conn').onclick=connect;
  $('#apply').onclick=apply;
  $('#reboot').onclick=function(){
    confirmDlg({title:'重启设备',body:'重启后，已生效但未保存的修改会丢失，设备将使用已保存的设置。确定要重启吗？',note:'点击“确认重启”后，设备将重启并断开网页连接。',ok:'确认重启',onOk:function(){
      S.connected=false;S.cfg=clone(S.saved);resetSnap();S.active=S.savedActive;S.io4=S.io4Saved;addLog('已重启设备，连接已断开');S.flash=null;renderAll();
    }});
  };
  $('#io4').onclick=function(){
    if(!S.io4){
      confirmDlg({title:'启用 IO4 模式？',warning:'启用后，配置网页将无法连接设备。',body:'应用并保存后，下次上电进入 IO4 模式。需要返回普通模式时，按住本设备的 BT10，再重新接通电源。',note:'这里只选择启动模式，不会直接切换，应用并保存后重启生效。',ok:'了解，选择 IO4',onOk:function(){
        S.io4=true;addLog('启动模式：普通模式 → IO4 模式（未保存）');S.flash=null;renderAll();
      }});
    }else{S.io4=false;addLog('启动模式：IO4 模式 → 普通模式（未保存）');S.flash=null;renderAll()}
  };
  $('#newTpl').onclick=function(){createTpl(false)};
  $('#len').onchange=function(){S.cfg.light.enabled=this.checked;changed()};
  $('#lmode').onchange=function(){S.cfg.light.mode=this.value;changed()};
  $('#lbright').oninput=function(){S.cfg.light.bright=+this.value;$('#lbv').textContent=this.value;changed()};
  $('#knobL').onclick=function(){select({type:'knobL'})};
  $('#knobR').onclick=function(){select({type:'knobR'})};
  $('#slider').onclick=function(){select({type:'slider'})};
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){
    S.tab=this.dataset.tab;
    $('#statusPage').style.display=S.tab==='status'?'flex':'none';$('#fwPage').style.display=S.tab==='firmware'?'flex':'none';$('#labPage').style.display=S.tab==='lab'?'flex':'none';
    renderTop();
  };
  function keyName(e){
    var k=e.key;
    if(k===' ')return 'Space';
    if(k.length===1)return k.toUpperCase();
    return k.replace('Arrow','方向 ');
  }
  document.addEventListener('keydown',function(e){
    if(!S.listen||S.sel.type!=='key')return;
    e.preventDefault();
    if(e.key==='Escape'){S.listen=false;renderRight();return}
    if(['Shift','Control','Alt','Meta'].indexOf(e.key)>=0&&false)return;
    S.cfg.keys[S.sel.id].action='键盘 · '+keyName(e);S.listen=false;changed();renderRight();
  },true);
  /* 手动测试：滚轮转旋钮，拖动滑轨 */
  function manual(){return S.connected&&$('#sim').value==='manual'}
  ;[['#knobL','lk'],['#knobR','rk']].forEach(function(p){
    $(p[0]).addEventListener('wheel',function(e){if(!manual())return;e.preventDefault();S.sig[p[1]]+=(e.deltaY>0?1:-1)*.125},{passive:false});
  });
  var drag=false;
  function dragTo(e){
    var r=$('#track').getBoundingClientRect();
    S.sig.sl=clamp((e.clientX-r.left)/r.width);
  }
  $('#slider').addEventListener('pointerdown',function(e){if(!manual())return;drag=true;dragTo(e);this.setPointerCapture(e.pointerId)});
  $('#slider').addEventListener('pointermove',function(e){if(drag)dragTo(e)});
  $('#slider').addEventListener('pointerup',function(){drag=false});
  $('#sim').onchange=function(){if(this.value==='demo')S.t0=performance.now()};

  $('#knobL').innerHTML=knobSVG('L');$('#knobR').innerHTML=knobSVG('R');
  buildColors();resetSnap();renderAll();
  requestAnimationFrame(loop);
})();
</script>
