# FluxRail test site on the user's Ubuntu 24.04 server.
# Certbot adds HTTPS and the HTTP -> HTTPS redirect after DNS/port 80 work.
server {
    listen 80;
    listen [::]:80;
    server_name fluxrail.baka.moe;

    root /srv/fluxrail/current;
    index index.html;
    autoindex off;
    charset utf-8;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "serial=(self)" always;

    location = /favicon.ico {
        try_files /assets/fluxrail-favicon.ico =404;
    }
    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD { deny all; }
    }
    location ~ /\. {
        deny all;
    }
}
